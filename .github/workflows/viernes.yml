name: Borradores del viernes

# Viernes 10:00. F3 (el punto ciego) y F4 (el desafio), los dos
# formatos cortos. F4 lleva encuesta nativa de X: el humano la crea a
# mano al publicar, con las tres opciones 1 / X / 2.
on:
  schedule:
    - cron: "0 9 * * 5"
  workflow_dispatch:

jobs:
  redactar:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: F3 y F4 a Telegram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.deliver.telegram F3 F4