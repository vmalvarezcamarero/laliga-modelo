name: Auditoria

# Lunes 09:00. EGO se somete a su propia criba (D-12).
# Es la publicacion mas importante y se publica gane o pierda.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas numpy scipy matplotlib requests tzdata anthropic

      - name: Instalar JetBrains Mono
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-jetbrains-mono
          rm -f ~/.cache/matplotlib/fontlist-*.json

      - name: JSON de auditoria
        run: python -m src.evaluate.auditoria

      - name: Guardar la auditoria en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/predictions/
          git diff --staged --quiet || git commit -m "Auditoria del lunes"
          git pull --rebase
          git push

      - name: Borradores de F5 a Telegram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.deliver.telegram F5